{% extends "base.html" %}

{% block content %}
<style>
  @keyframes radar-pulse {
    0%, 100% { transform: scale(1); opacity: 0.4; }
    50% { transform: scale(1.08); opacity: 0.8; }
  }
  @keyframes float-slow {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(3deg); }
  }
  @keyframes ai-glow {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(255,255,255,0.3)); opacity: 0.8; }
    50% { filter: drop-shadow(0 0 20px rgba(255,255,255,0.8)); opacity: 1; }
  }
  @keyframes scan-line {
    0% { transform: translateY(-15px); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(20px); opacity: 0; }
  }
  
  .animate-radar { animation: radar-pulse 4s ease-in-out infinite; }
  .animate-float { animation: float-slow 6s ease-in-out infinite; }
  .animate-ai-glow { animation: ai-glow 3s ease-in-out infinite; }
  .animate-scan { animation: scan-line 2.5s linear infinite; }
</style>

<div class="relative min-h-[85vh] w-full flex flex-col items-center justify-center overflow-hidden px-4 py-12">
  
  <div class="absolute top-10 left-1/4 w-[500px] h-[500px] bg-brand-orange/10 rounded-full blur-[140px] pointer-events-none animate-pulse [animation-duration:8s]"></div>
  <div class="absolute bottom-10 right-1/4 w-[600px] h-[600px] bg-brand-cyan/10 rounded-full blur-[160px] pointer-events-none animate-pulse [animation-duration:12s]"></div>
  
  <div class="absolute inset-0 bg-[linear-gradient(to_right,rgba(255,255,255,0.02)_1px,transparent_1px),linear-gradient(to_bottom,rgba(255,255,255,0.02)_1px,transparent_1px)] bg-[size:4rem_4rem] pointer-events-none"></div>

  <div class="relative z-10 w-full max-w-4xl mx-auto text-center flex flex-col items-center">
    
    <div class="relative w-36 h-36 mb-10 flex items-center justify-center group">
      <div class="absolute inset-0 bg-gradient-to-r from-brand-orange to-brand-cyan rounded-2xl opacity-10 blur-xl group-hover:opacity-20 transition-opacity duration-500"></div>
      <div class="absolute -inset-4 border border-white/5 rounded-full animate-radar pointer-events-none"></div>
      <div class="absolute -inset-8 border border-white/5 rounded-full animate-radar pointer-events-none [animation-delay:2s]"></div>
      
      <div class="w-24 h-24 bg-white/[0.03] border border-white/10 rounded-2xl backdrop-blur-md flex items-center justify-center shadow-2xl relative overflow-hidden animate-float">
        
        <div class="absolute left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-brand-cyan to-transparent opacity-70 animate-scan"></div>
        
        <svg class="w-14 h-14 text-white animate-ai-glow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
          <rect class="opacity-40" x="8" y="8" width="36" height="48" rx="6" stroke="white" stroke-width="2" stroke-dasharray="4 3"/>
          <rect class="opacity-30 transition-all duration-300 group-hover:opacity-50" x="14" y="18" width="16" height="3.5" rx="1.75" fill="white"/>
          <rect class="opacity-40 transition-all duration-300 group-hover:opacity-60" x="14" y="26" width="22" height="3.5" rx="1.75" fill="white"/>
          <rect class="opacity-60 transition-all duration-300 group-hover:opacity-80" x="14" y="34" width="12" height="3.5" rx="1.75" fill="white"/>
          <rect class="opacity-80" x="14" y="42" width="18" height="3.5" rx="1.75" fill="white"/>
          <path class="opacity-70" d="M12 50q0 2 2 2q-2 0-2 2q0-2-2-2q2 0 2-2z" fill="white"/>
          <path d="M46 12q0 3 3 3q-3 0-3 3q0-3-3-3q3 0 3-3z" fill="white"/>
          <circle cx="40" cy="36" r="14" stroke="white" stroke-width="2.5" fill="white" fill-opacity=".05"/>
          <path d="M50 46l8 8" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
          <path class="origin-center transition-transform duration-700 group-hover:rotate-45" d="M40 25q0 11 11 11q-11 0-11 11q0-11-11-11q11 0 11-11z" fill="white"/>
          <path class="opacity-90" d="M24 10c5-2.5 11-2.5 16 0" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <h1 class="text-3xl md:text-5xl font-black text-white tracking-tight mb-6 bg-clip-text text-transparent bg-gradient-to-b from-white via-slate-200 to-slate-400 max-w-3xl">
      Discover Content Through True AI
    </h1>
    
    <p class="text-slate-400 text-lg md:text-xl max-w-2xl mb-12 leading-relaxed">
      Deploy neural discovery workers to run automated analytical workflows across media platforms. Isolate target metrics, filter quality thresholds, and auto-queue matching data pools immediately.
    </p>

    <div class="w-full max-w-sm px-4">
      <div class="relative group">
        <div class="absolute -inset-1 bg-gradient-to-r from-brand-orange to-brand-cyan rounded-2xl blur-md opacity-40 group-hover:opacity-100 transition duration-500"></div>
        
        <button type="button" id="activate_service_btn" onclick="activateDiscovery()"
                class="relative w-full bg-gradient-to-r h-10 from-brand-orange to-brand-orange/90 hover:from-brand-orange hover:to-brand-cyan text-white font-bold py-4.5 px-8 rounded-2xl shadow-2xl transition-all duration-300 transform group-hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center space-x-3 text-base tracking-wide">
          <span id="btn_text">Initialize Discovery Engine</span>
          <svg id="btn_icon" class="w-5 h-5 transition-transform duration-300 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </button>
      </div>
      
      <div class="mt-4 h-6">
        <p id="activation_status" class="text-sm font-semibold tracking-wide text-brand-cyan opacity-0 transition-all duration-300 translate-y-1"></p>
      </div>
    </div>

  </div>
</div>

<script>
  async function activateDiscovery() {
    const btn = document.getElementById("activate_service_btn");
    const btnText = document.getElementById("btn_text");
    const statusText = document.getElementById("activation_status");

    btn.disabled = true;
    btnText.innerText = "Configuring Nodes...";
    
    statusText.innerText = "Spawning background threads...";
    statusText.classList.remove("opacity-0", "translate-y-1");

    try {
      // Connects back seamlessly to your existing dashboard operational schema
      await axios.post("/dashboard/api/ai-discovery/activate", { isActive: true });
      
      statusText.innerText = "Discovery engines fully online.";
      statusText.classList.replace("text-brand-cyan", "text-emerald-400");
      btnText.innerText = "Synchronizing Dashboard...";
      
      setTimeout(() => {
        location.reload();
      }, 1200);

    } catch (err) {
      btn.disabled = false;
      btnText.innerText = "Initialize Discovery Engine";
      statusText.innerText = "Cluster initialization rejected. Retry deployment.";
      statusText.classList.replace("text-brand-cyan", "text-red-400");
      console.error(err);
    }
  }
</script>
{% endblock %}
