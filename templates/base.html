<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Social Bot - Automate Your Content</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.2.1/axios.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="/static/icon.png" type="image/png" />
<style>
  :root {
    --bg: #0A0B0D;
    --bg-raised: #111317;
    --bg-raised-2: #15171C;
    --paper: #F2F1ED;
    --dim: #8A8D92;
    --dimmer: #5A5D63;
    --hairline: #1E2024;
    --hairline-2: #26282D;
    --signal: #3FFF8D;
    --signal-dim: #1E7A4A;
    --amber: #FFB454;
    --amber-dim: #8A5E26;
    --red: #FF6B6B;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--paper);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-display);
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--signal); color: #06140C; }
  html { scroll-behavior: smooth; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: rgba(10,11,13,0.4); }
  ::-webkit-scrollbar-thumb { background: rgba(63,255,141,0.25); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(63,255,141,0.4); }

  /* ── scan lines + mouse glow, identical to index.html ─────────────── */
  .scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    opacity: 0.5;
  }

  .bg-glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(560px circle at var(--mx, 50%) var(--my, 20%), rgba(63,255,141,0.05), transparent 70%);
  }

  @media (prefers-reduced-motion: reduce) { .bg-glow { display: none; } }

  .pulse-dot { animation: pulse-dot-kf 2s ease-in-out infinite; }
  @keyframes pulse-dot-kf { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* ── shared component classes, lifted from index.html ─────────────── */
  .glass {
    background: var(--bg-raised);
    border: 1px solid var(--hairline-2);
    border-radius: 12px;
  }

  .glass::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(63,255,141,0.04) 1px, transparent 1px);
    background-size: 18px 18px;
    pointer-events: none;
    border-radius: inherit;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-body); font-weight: 600; font-size: 14px;
    padding: 10px 20px; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent; transition: all 0.15s ease; white-space: nowrap;
  }
  .btn-primary { background: var(--signal); color: #06140C; }
  .btn-primary:hover { background: #5FFFA5; transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--paper); border-color: var(--hairline-2); }
  .btn-ghost:hover { border-color: var(--dim); }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 11.5px; color: var(--signal);
    background: rgba(63,255,141,0.08); border: 1px solid rgba(63,255,141,0.25);
    padding: 5px 12px; border-radius: 4px; letter-spacing: 0.02em;
  }
  .eyebrow .blip { width: 6px; height: 6px; border-radius: 50%; background: var(--signal); animation: pulse-dot-kf 1.6s ease-in-out infinite; }

  .mono { font-family: var(--font-mono); }

  /* ── top nav ──────────────────────────────────────────────────────── */
  .topnav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(10,11,13,0.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--hairline);
  }
  .topnav-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 64px; padding: 0 24px;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 16px; }
  .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 8px var(--signal); animation: pulse-dot-kf 2s ease-in-out infinite; }

  .icon-btn {
    padding: 8px; border-radius: 8px; color: var(--dim);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.05); color: var(--paper); }

  .mobile-menu-btn { display: none; }

  /* ── layout shell ─────────────────────────────────────────────────── */
  .shell { display: flex; min-height: 100vh; position: relative; }
  .main-col { flex: 1; display: flex; flex-direction: column; }
  .content-area { flex: 1; display: flex; width: 100%; position: relative; z-index: 1; }

  /* ── sidebar ──────────────────────────────────────────────────────── */
  .sidebar {
    width: 240px; flex-shrink: 0;
    background: rgba(10,11,13,0.85); backdrop-filter: blur(12px);
    border-right: 1px solid var(--hairline);
    display: flex; flex-direction: column;
    padding: 24px 14px;
    height: calc(100vh - 64px);
    position: sticky; top: 64px;
    transition: transform 0.25s ease;
  }

  .sidebar-nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }

  .sidebar-link {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; border-radius: 8px;
    color: var(--dim); font-size: 14px; font-weight: 500;
    border-left: 2px solid transparent;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .sidebar-link svg { width: 18px; height: 18px; flex-shrink: 0; }
  .sidebar-link:hover { background: rgba(255,255,255,0.03); color: var(--paper); }
  .sidebar-link.active {
    background: rgba(63,255,141,0.07);
    border-left-color: var(--signal);
    color: var(--signal);
  }

  .sidebar-foot { border-top: 1px solid var(--hairline); padding-top: 16px; margin-top: 16px; }
  .user-row { display: flex; align-items: center; gap: 12px; padding: 0 4px; }
  .user-avatar { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--hairline-2); flex-shrink: 0; object-fit: cover; }
  .user-meta { min-width: 0; }
  .user-name { font-size: 13.5px; font-weight: 500; color: var(--paper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-status { font-size: 11px; color: var(--dimmer); font-family: var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .sidebar-overlay { display: none; }
  .sidebar-overlay.active {
    display: block; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 39;
  }

  /* ── page content ─────────────────────────────────────────────────── */
  .page-content { flex: 1; padding: 28px 32px; min-width: 0; }

  @media (max-width: 860px) {
    .mobile-menu-btn { display: flex; }
    .sidebar {
      position: fixed; top: 50px; left: 0; z-index: 40;
      height: 93%; transform: translateX(-100%);
    }
    .sidebar.active { transform: translateX(0); }
    .page-content { padding: 20px 18px; }
  }
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="bg-glow" id="bgGlow"></div>

<div class="shell">
  <div class="main-col">

    <nav class="topnav">
      <div class="topnav-inner">
        <button class="icon-btn mobile-menu-btn" id="sidebarToggle" aria-label="Toggle menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <a href="/" class="logo"><span class="logo-dot"></span>Social Bot</a>

        <div style="flex:1"></div>

        <a href="/dashboard/settings" class="icon-btn" aria-label="Settings">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </a>
      </div>
    </nav>

    <div class="content-area">
      <div class="sidebar-overlay" id="sidebarOverlay"></div>

      <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
          <a href="/dashboard" class="sidebar-link {% if request.url.path == '/dashboard/' %}active{% endif %}">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-3m0 0l7-4 7 4M5 9v10a1 1 0 001 1h12a1 1 0 001-1V9m-9 5h4"/></svg>
            Dashboard
          </a>
          <a href="/dashboard/videos" class="sidebar-link {% if 'videos' in request.url.path %}active{% endif %}">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Videos
          </a>
          <a href="/dashboard/plan" class="sidebar-link {% if 'plan' in request.url.path %}active{% endif %}">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
            Plan
          </a>
          <a href="/dashboard/ai-discovery" class="sidebar-link {% if 'ai-discovery' in request.url.path %}active{% endif %}">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.3-4.3"/></svg>
            AI Discovery
          </a>
          <a href="/dashboard/settings" class="sidebar-link {% if 'settings' in request.url.path %}active{% endif %}">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            Settings
          </a>
        </nav>

        <div class="sidebar-foot">
          <div class="user-row">
            <img src="{{ user_info.avator }}" alt="" class="user-avatar">
            <div class="user-meta">
              <div class="user-name">{{ user_info.fullname }}</div>
              <div class="user-status">{{ user_info.account_status }}</div>
            </div>
          </div>
        </div>
      </aside>

      <div class="page-content">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
</div>

<script>
  const sidebar = document.getElementById("sidebar");
  const sidebarOverlay = document.getElementById("sidebarOverlay");
  const sidebarToggle = document.getElementById("sidebarToggle");

  if (sidebarToggle) {
    sidebarToggle.addEventListener("click", () => {
      sidebar.classList.toggle("active");
      sidebarOverlay.classList.toggle("active");
    });
  }
  sidebarOverlay.addEventListener("click", () => {
    sidebar.classList.remove("active");
    sidebarOverlay.classList.remove("active");
  });
  document.querySelectorAll(".sidebar-link").forEach((link) => {
    link.addEventListener("click", () => {
      if (window.innerWidth <= 860) {
        sidebar.classList.remove("active");
        sidebarOverlay.classList.remove("active");
      }
    });
  });
  window.addEventListener("resize", () => {
    if (window.innerWidth > 860) {
      sidebar.classList.remove("active");
      sidebarOverlay.classList.remove("active");
    }
  });

  // mouse-reactive glow — identical behavior to index.html
  const root = document.documentElement;
  let targetX = 50, targetY = 20, curX = 50, curY = 20;
  window.addEventListener('mousemove', (e) => {
    targetX = (e.clientX / window.innerWidth) * 100;
    targetY = (e.clientY / window.innerHeight) * 100;
  }, { passive: true });
  function animateGlow() {
    curX += (targetX - curX) * 0.08;
    curY += (targetY - curY) * 0.08;
    root.style.setProperty('--mx', curX + '%');
    root.style.setProperty('--my', curY + '%');
    requestAnimationFrame(animateGlow);
  }
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    requestAnimationFrame(animateGlow);
  }
</script>
</body>
</html>
