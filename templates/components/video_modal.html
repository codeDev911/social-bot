<div
  id="modal"
  class="w-screen hidden bg-gray-800/70 fixed top-0 left-0 flex h-screen justify-center items-center"
>
  <div
    class="md:w-[50%] w-[98%] bg-white max-h-[98vh] overflow-y-auto rounded-xl shadow-xl"
  >
    <!-- Preview upload progress -->

    <div
      class="flex sticky p-5 pb-3 top-0 bg-white items-center text-gray-800 justify-between text-sm font-semibold"
    >
      <h2 class="text-2xl">Submit video</h2>
      <button
        type="reset"
        onclick="cancelUpload()"
        class="p-2 rounded-md bg-red-500 text-sm text-white px-3 hover:bg-red-400 active:bg-red-500 shadow-lg rounded-md"
      >
        Cancel
      </button>
    </div>

    <div class="grid px-5 pb-5 grid-cols-3 max-sm:grid-cols-1 gap-4 mt-3">
      <div class="flex flex-col col-span-1 space-y-2">
        <div
          id="video_preview"
          class="rounded-lg max-sm:w-[50%] mx-auto overflow-hidden"
        ></div>
      </div>
      <div class="col-span-2">
        <div class="flex flex-col space-y-1">
          <p
            class="flex flex-col line-clamp-1 w-full text-sm font-medium text-gray-600"
            id="show-title"
          >
            Title :
          </p>
          <p
            class="flex flex-col text-sm font-medium text-gray-600"
            id="show-size"
          >
            Size :
          </p>
        </div>
        <div class="p-2 border border-dashed border-2 my-2">
          <div class="flex flex-col mt-3 space-y-2 font-medium text-gray-600">
            <label for="title">Video title</label>
            <input
              id="title input-text"
              class="p-2 rounded-md border-gray-300 border outline-blue-500"
            />
          </div>
          <div class="flex flex-col mt-3 space-y-2 font-medium text-gray-600">
            <label for="desc">Description</label>

            <textarea
              id="desc input-text"
              class="p-2 rounded-md border-gray-300 min-h-[70px] max-h-[150px] border outline-blue-500"
            ></textarea>
          </div>
          <div class="py-2 grid md:grid-cols-2">
            <div></div>
            <button
              type="submit"
              class="p-2 rounded-md bg-blue-500 text-white text-sm font-medium px-4 hover:bg-blue-400 active:bg-blue-500"
            >
              Submit
            </button>
            <div id="preview-progress" class="animate-pulse"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const cancelUpload = () => {
    document.getElementById("modal").classList.toggle("hidden");
  };
  document.querySelector("#input-text").disabled = true;
</script>
