<!-- Edit Video Modal -->
<div id="editVideoModal" class="evm-backdrop hidden">
  <div class="evm-modal">

    <!-- Header -->
    <div class="evm-header">
      <div>
        <p class="evm-eyebrow">Video</p>
        <h2 class="evm-title">Edit Video</h2>
      </div>
      <button type="button" onclick="closeEditVideoModal()" class="evm-close-btn">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Scrollable body -->
    <div class="evm-body">
      <form id="editVideoForm" class="evm-form">
        <input type="hidden" id="editVideoId">

        <!-- Video preview + meta -->
        <div class="evm-preview-row">
          <div class="evm-preview-thumb">
            <video id="editVideoPreview" muted playsinline></video>
          </div>
          <div class="evm-preview-meta">
            <div>
              <p class="evm-label">Video URL</p>
              <p id="editVideoUrl" class="evm-url"></p>
            </div>
            <div>
              <p class="evm-label">Upload Status</p>
              <span id="editVideoStatusChip" class="chip"></span>
            </div>
          </div>
        </div>

        <!-- Title -->
        <div>
          <label class="evm-label" for="editVideoTitle">Video Title</label>
          <input type="text" id="editVideoTitle" placeholder="Enter video title" class="evm-input" required>
        </div>

        <!-- Description -->
        <div>
          <label class="evm-label" for="editVideoDescription">Description</label>
          <textarea id="editVideoDescription" placeholder="Enter video description" rows="3" class="evm-textarea"></textarea>
        </div>

        <!-- Upload destinations -->
        <div>
          <label class="evm-label" style="margin-bottom:12px;">Upload Destinations</label>
          <div id="editPlatformsList" class="evm-platform-grid"></div>
        </div>

        <div class="evm-divider"></div>

        <!-- Actions -->
        <div class="evm-actions">
          <button type="button" onclick="closeEditVideoModal()" class="evm-btn evm-btn-ghost">Cancel</button>

          <!-- Reschedule (shown for Failed videos) -->
          <button type="button" id="editVideoRescheduleBtn" onclick="rescheduleVideoFromModal()" class="evm-btn evm-btn-amber hidden">
            Reschedule
          </button>

          <!-- Save (hidden for Failed) -->
          <button type="submit" id="editVideoSubmitBtn" class="evm-btn evm-btn-primary">Save changes</button>
        </div>

      </form>
    </div>
  </div>
</div>

<style>
  /* ── backdrop + modal shell ───────────────────────────────────────── */
  .evm-backdrop {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(10,11,13,0.8); backdrop-filter: blur(6px);
    align-items: center; justify-content: center; padding: 20px;
  }
  .evm-backdrop.hidden { display: none; }
  .evm-backdrop:not(.hidden) { display: flex; }

  .evm-modal {
    position: relative; width: 100%; max-width: 640px;
    border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
    background: var(--bg-raised); border: 1px solid var(--hairline-2);
    max-height: 90vh;
  }

  /* ── header ───────────────────────────────────────────────────────── */
  .evm-header {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px; border-bottom: 1px solid var(--hairline); background: var(--bg-raised);
  }
  .evm-eyebrow {
    font-family: var(--font-mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--dimmer); margin-bottom: 2px;
  }
  .evm-title { font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--paper); letter-spacing: -0.01em; }
  .evm-close-btn {
    width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--hairline-2); color: var(--dim); background: none; cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .evm-close-btn:hover { border-color: var(--dim); color: var(--paper); }

  /* ── body / form ──────────────────────────────────────────────────── */
  .evm-body { overflow-y: auto; flex: 1; }
  .evm-form { padding: 22px 24px; display: flex; flex-direction: column; gap: 20px; }

  .evm-label {
    display: block; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--dimmer); margin-bottom: 8px;
  }

  .evm-preview-row {
    display: flex; gap: 16px; padding: 16px; border-radius: 12px;
    background: var(--bg-raised-2); border: 1px solid var(--hairline);
  }
  .evm-preview-thumb {
    flex-shrink: 0; width: 112px; height: 80px; border-radius: 8px; overflow: hidden;
    background: var(--bg); border: 1px solid var(--hairline-2);
  }
  .evm-preview-thumb video { width: 100%; height: 100%; object-fit: cover; }
  .evm-preview-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
  .evm-url { font-family: var(--font-mono); font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .evm-input, .evm-textarea {
    width: 100%; background: var(--bg-raised-2); border: 1px solid var(--hairline-2);
    border-radius: 8px; padding: 10px 14px; color: var(--paper); font-size: 14px;
    font-family: var(--font-body); transition: border-color 0.15s ease; outline: none;
  }
  .evm-input::placeholder, .evm-textarea::placeholder { color: var(--dimmer); }
  .evm-input:focus, .evm-textarea:focus { border-color: var(--signal-dim); }
  .evm-textarea { resize: none; font-family: var(--font-body); }
  .evm-input:disabled, .evm-textarea:disabled { opacity: 0.45; cursor: not-allowed; }

  .evm-platform-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 480px) { .evm-platform-grid { grid-template-columns: repeat(4, 1fr); } }

  .evm-divider { border-top: 1px solid var(--hairline); }

  .evm-actions { display: flex; gap: 12px; }
  .evm-btn {
    flex: 1; padding: 11px; border-radius: 8px; font-family: var(--font-body);
    font-weight: 600; font-size: 13.5px; cursor: pointer; transition: all 0.15s ease;
    border: 1px solid transparent; text-align: center;
  }
  .evm-btn-ghost { background: none; border-color: var(--hairline-2); color: var(--dim); }
  .evm-btn-ghost:hover { border-color: var(--dim); color: var(--paper); }
  .evm-btn-primary { background: var(--signal); color: #06140C; }
  .evm-btn-primary:hover:not(:disabled) { background: #5FFFA5; }
  .evm-btn-primary:disabled { opacity: 0.7; cursor: default; }
  .evm-btn-amber { background: rgba(255,180,84,0.1); color: var(--amber); border-color: rgba(255,180,84,0.25); }
  .evm-btn-amber:hover { background: rgba(255,180,84,0.18); }

  .hidden { display: none !important; }

  /* ── status chip ──────────────────────────────────────────────────── */
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 11px; border-radius: 20px;
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  }
  .chip-green { background: rgba(63,255,141,0.1); color: var(--signal); border: 1px solid rgba(63,255,141,0.25); }
  .chip-amber { background: rgba(255,180,84,0.1); color: var(--amber); border: 1px solid rgba(255,180,84,0.25); }
  .chip-red   { background: rgba(255,107,107,0.1); color: var(--red); border: 1px solid rgba(255,107,107,0.25); }
  .chip-dim   { background: rgba(138,141,146,0.1); color: var(--dim); border: 1px solid var(--hairline-2); }

  /* ── platform checkbox cards ──────────────────────────────────────── */
  .edit-plat-check {
    display: flex; align-items: center; gap: 9px; padding: 10px 12px;
    border-radius: 8px; cursor: pointer; transition: border-color 0.15s ease;
    border: 1px solid var(--hairline); background: var(--bg-raised-2);
  }
  .edit-plat-check.checked { border-color: var(--signal-dim); }
  .edit-plat-check input { display: none; }
  .edit-plat-check .plat-name {
    font-size: 13px; text-transform: capitalize; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }

  /* platform glyphs */
  .plat-glyph {
    width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 9.5px; font-weight: 700;
  }
  .glyph-yt { background: rgba(255,107,107,0.14); color: #FF8A8A; }
  .glyph-tt { background: rgba(143,143,255,0.14); color: #ABABFF; }
  .glyph-ig { background: rgba(255,180,84,0.14); color: var(--amber); }
  .glyph-fb { background: rgba(143,187,255,0.14); color: #8FBBFF; }
</style>

<script>
  const editVideoModal       = document.getElementById('editVideoModal');
  const editVideoForm        = document.getElementById('editVideoForm');
  const editVideoId          = document.getElementById('editVideoId');
  const editVideoTitle       = document.getElementById('editVideoTitle');
  const editVideoDescription = document.getElementById('editVideoDescription');
  const editVideoPreview     = document.getElementById('editVideoPreview');
  const editVideoUrl         = document.getElementById('editVideoUrl');
  const editVideoStatusChip  = document.getElementById('editVideoStatusChip');
  const editPlatformsList    = document.getElementById('editPlatformsList');
  const editVideoSubmitBtn   = document.getElementById('editVideoSubmitBtn');
  const editVideoRescheduleBtn = document.getElementById('editVideoRescheduleBtn');

  // platform glyph config
  const PLAT_CONFIG = {
    youtube:   { tag: 'YT', cls: 'glyph-yt' },
    tiktok:    { tag: 'TT', cls: 'glyph-tt' },
    instagram: { tag: 'IG', cls: 'glyph-ig' },
    facebook:  { tag: 'FB', cls: 'glyph-fb' },
  };

  function platformKey(name) { return name.toLowerCase().replace('google', 'youtube'); }

  // status chip colours
  function statusChip(status) {
    const map = {
      'pending':    ['chip-amber', '●'],
      'processing': ['chip-amber', '●'],
      'published':  ['chip-green', '✓'],
      'uploaded':   ['chip-green', '✓'],
      'failed':     ['chip-red',   '✕'],
      'canceled':   ['chip-dim',   '—'],
    };
    const [cls, icon] = map[(status || '').toLowerCase()] || ['chip-dim', '—'];
    return { cls, icon };
  }

  function openEditVideoModal(videoData) {
    editVideoId.value = videoData.id;
    editVideoTitle.value = videoData.title || '';
    editVideoDescription.value = videoData.captions || '';
    editVideoPreview.src = videoData.cloudinary_url || '';
    editVideoUrl.textContent = videoData.cloudinary_url || 'N/A';

    // status chip
    const { cls, icon } = statusChip(videoData.upload_status);
    editVideoStatusChip.className = `chip ${cls}`;
    editVideoStatusChip.textContent = `${icon} ${videoData.upload_status || 'Unknown'}`;

    // failed → show reschedule, hide save, disable fields
    const isFailed = (videoData.upload_status === 'Failed');
    editVideoSubmitBtn.classList.toggle('hidden', isFailed);
    editVideoRescheduleBtn.classList.toggle('hidden', !isFailed);
    editVideoTitle.disabled = isFailed;
    editVideoDescription.disabled = isFailed;

    // platform checkboxes
    editPlatformsList.innerHTML = '';
    const providers = (videoData.connected_providers || []).map(p =>
      p === 'google' ? 'Youtube' : p.charAt(0).toUpperCase() + p.slice(1)
    );
    let destinations = videoData.upload_destinations || [];
    if (typeof destinations === 'string') { try { destinations = JSON.parse(destinations); } catch { destinations = []; } }
    if (!Array.isArray(destinations)) destinations = [];

    providers.forEach(platform => {
      const key = platformKey(platform);
      const conf = PLAT_CONFIG[key] || { tag: platform.slice(0, 2).toUpperCase(), cls: 'glyph-fb' };
      const isOn = destinations.includes(platform);

      const label = document.createElement('label');
      label.className = 'edit-plat-check' + (isOn ? ' checked' : '');
      label.onclick = () => {
        const cb = label.querySelector('input');
        cb.checked = !cb.checked;
        label.classList.toggle('checked', cb.checked);
        label.querySelector('.plat-name').style.color = cb.checked ? 'var(--paper)' : 'var(--dim)';
      };

      label.innerHTML = `
        <input type="checkbox" value="${platform}" ${isOn ? 'checked' : ''}>
        <span class="plat-glyph ${conf.cls}">${conf.tag}</span>
        <span class="plat-name" style="color:${isOn ? 'var(--paper)' : 'var(--dim)'}">${platform}</span>
      `;
      editPlatformsList.appendChild(label);
    });

    editVideoModal.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }

  function closeEditVideoModal() {
    editVideoModal.classList.add('hidden');
    document.body.style.overflow = '';
    editVideoForm.reset();
    editVideoPreview.src = '';
  }

  async function rescheduleVideoFromModal() {
    const id = editVideoId.value;
    try {
      await axios.post(`/dashboard/api/videos/${id}/reschedule`);
      closeEditVideoModal();
      location.reload();
    } catch (err) {
      const msg = err.response?.data?.detail || 'Failed to reschedule video';
      alert(`Error: ${msg}`);
    }
  }

  editVideoForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = editVideoId.value;
    const title = editVideoTitle.value.trim();
    const description = editVideoDescription.value;
    const destinations = Array.from(editPlatformsList.querySelectorAll('input[type="checkbox"]'))
      .filter(cb => cb.checked).map(cb => cb.value);

    if (!title) { alert('Please enter a video title'); return; }
    if (!destinations.length) { alert('Please select at least one platform'); return; }

    editVideoSubmitBtn.disabled = true;
    editVideoSubmitBtn.textContent = 'Saving...';

    try {
      const res = await axios.put(`/dashboard/api/videos/${id}`, {
        title, captions: description, upload_destinations: destinations
      });
      if (res.status === 200) {
        closeEditVideoModal();
        setTimeout(() => location.reload(), 400);
      }
    } catch {
      alert('Failed to update video. Please try again.');
    } finally {
      editVideoSubmitBtn.disabled = false;
      editVideoSubmitBtn.textContent = 'Save changes';
    }
  });

  // close on backdrop click
  editVideoModal.addEventListener('click', e => {
    if (e.target === editVideoModal) closeEditVideoModal();
  });

  // close on Escape
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !editVideoModal.classList.contains('hidden')) closeEditVideoModal();
  });
</script>
