<!-- Edit Video Modal -->
<div
  id="editVideoModal"
  class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50"
>
  <div class="bg-gray-900 rounded-xl shadow-2xl border border-white/10 w-full max-w-2xl max-h-[90vh] overflow-y-auto">
    <!-- Modal Header -->
    <div class="sticky top-0 flex items-center justify-between p-6 border-b border-white/10 bg-gray-900">
      <h2 class="text-2xl font-bold text-white">Edit Video</h2>
      <button
        type="button"
        onclick="closeEditVideoModal()"
        class="p-2 hover:bg-white/10 rounded-lg transition-colors text-slate-400 hover:text-white"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Modal Content -->
    <form id="editVideoForm" class="space-y-6 p-6">
      <!-- Hidden video ID -->
      <input type="hidden" id="editVideoId" />

      <!-- Video Preview -->
      <div class="flex gap-6">
        <div class="flex-shrink-0">
          <div class="w-24 h-24 rounded-lg bg-gradient-to-br from-brand-orange/20 to-brand-cyan/20 flex items-center justify-center border border-brand-orange/30 overflow-hidden">
            <video
              id="editVideoPreview"
              class="w-full h-full object-cover rounded-lg"
              controls
              muted
            ></video>
          </div>
        </div>
        <div class="flex-1 flex flex-col justify-center space-y-2">
          <div>
            <p class="text-xs text-slate-400 uppercase tracking-wide">Video URL</p>
            <p id="editVideoUrl" class="text-sm text-slate-300 break-all"></p>
          </div>
          <div>
            <p class="text-xs text-slate-400 uppercase tracking-wide">Upload Status</p>
            <p id="editVideoStatus" class="text-sm text-slate-300"></p>
          </div>
        </div>
      </div>

      <!-- Video Title -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">Video Title</label>
        <input
          type="text"
          id="editVideoTitle"
          placeholder="Enter video title"
          class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-white placeholder-slate-500 focus:border-brand-orange/50 focus:outline-none transition-colors"
          required
        />
      </div>

      <!-- Description/Caption -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">Description</label>
        <textarea
          id="editVideoDescription"
          placeholder="Enter video description"
          class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-white placeholder-slate-500 focus:border-brand-orange/50 focus:outline-none transition-colors resize-none"
          rows="3"
        ></textarea>
      </div>

      <!-- Upload Destinations -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-3">Upload Destinations</label>
        <div id="editPlatformsList" class="grid grid-cols-2 md:grid-cols-4 gap-2">
          <!-- Platforms will be dynamically added here -->
        </div>
      </div>

      <!-- Form Status -->
      <div id="editVideoStatus" class="text-sm font-medium text-center hidden"></div>

      <!-- Action Buttons -->
      <div class="flex gap-3 pt-4 border-t border-white/10">
        <button
          type="button"
          onclick="closeEditVideoModal()"
          class="flex-1 px-4 py-2 border border-white/10 text-slate-300 rounded-lg hover:border-white/20 hover:text-white transition-colors font-medium"
        >
          Cancel
        </button>
        <button
          type="button"
          id="editVideoRescheduleBtn"
          onclick="rescheduleVideoFromModal()"
          class="flex-1 px-4 py-2 bg-brand-orange/20 text-brand-orange border border-brand-orange/30 rounded-lg hover:bg-brand-orange/30 transition-colors font-medium hidden"
        >
          Reschedule
        </button>
        <button
          type="submit"
          id="editVideoSubmitBtn"
          class="flex-1 px-4 py-2 bg-gradient-to-r from-brand-orange to-brand-cyan text-gray-900 rounded-lg hover:shadow-lg hover:shadow-brand-orange/50 transition-all font-semibold"
        >
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  const editVideoModal = document.getElementById('editVideoModal');
  const editVideoForm = document.getElementById('editVideoForm');
  const editVideoId = document.getElementById('editVideoId');
  const editVideoTitle = document.getElementById('editVideoTitle');
  const editVideoDescription = document.getElementById('editVideoDescription');
  const editVideoPreview = document.getElementById('editVideoPreview');
  const editVideoUrl = document.getElementById('editVideoUrl');
  const editVideoStatus = document.getElementById('editVideoStatus');
  const editPlatformsList = document.getElementById('editPlatformsList');
  const editVideoSubmitBtn = document.getElementById('editVideoSubmitBtn');
  const editVideoRescheduleBtn = document.getElementById('editVideoRescheduleBtn');
  
  let currentVideoStatus = null; // Store current video status for reschedule check

  function openEditVideoModal(videoData) {
    // Set video ID
    editVideoId.value = videoData.id;
    currentVideoStatus = videoData.upload_status;

    // Set video details
    editVideoTitle.value = videoData.title || '';
    editVideoDescription.value = videoData.captions || '';
    editVideoPreview.src = videoData.cloudinary_url || '';
    editVideoUrl.textContent = videoData.cloudinary_url || 'N/A';
    editVideoStatus.textContent = videoData.upload_status || 'Unknown';

    // Show/hide buttons based on status
    if (videoData.upload_status === 'Failed') {
      editVideoSubmitBtn.classList.add('hidden');
      editVideoRescheduleBtn.classList.remove('hidden');
      // Disable form inputs for failed videos
      editVideoTitle.disabled = true;
      editVideoDescription.disabled = true;
    } else {
      editVideoSubmitBtn.classList.remove('hidden');
      editVideoRescheduleBtn.classList.add('hidden');
      // Enable form inputs for non-failed videos
      editVideoTitle.disabled = false;
      editVideoDescription.disabled = false;
    }

    // Get connected providers (convert provider names to platform format)
    const connectedProviders = videoData.connected_providers || [];
    const availablePlatforms = connectedProviders.map(provider => {
      if (provider === 'google') return 'Youtube';
      return provider.charAt(0).toUpperCase() + provider.slice(1);
    });

    // Set platform checkboxes
    editPlatformsList.innerHTML = '';
    
    // Ensure upload_destinations is an array
    let currentDestinations = videoData.upload_destinations || [];
    if (typeof currentDestinations === 'string') {
      currentDestinations = JSON.parse(currentDestinations);
    }
    if (!Array.isArray(currentDestinations)) {
      currentDestinations = [];
    }
    

    availablePlatforms.forEach(platform => {
      const isChecked = currentDestinations.includes(platform);
      const checkboxId = `edit_platform_${platform}`;

      const label = document.createElement('label');
      label.className = 'flex items-center space-x-2 p-3 bg-white/5 border border-white/10 rounded-lg cursor-pointer hover:border-brand-orange/30 transition-colors';

      const input = document.createElement('input');
      input.type = 'checkbox';
      input.id = checkboxId;
      input.className = 'w-4 h-4 rounded border-slate-400 text-brand-orange focus:ring-brand-orange';
      input.value = platform;
      input.checked = isChecked;

      const span = document.createElement('span');
      span.className = 'text-sm text-slate-300 capitalize';
      span.textContent = platform;

      label.appendChild(input);
      label.appendChild(span);
      editPlatformsList.appendChild(label);
    });

    // Show modal
    editVideoModal.classList.remove('hidden');
  }

  function closeEditVideoModal() {
    editVideoModal.classList.add('hidden');
    editVideoForm.reset();
  }

  async function rescheduleVideoFromModal() {
    const videoId = editVideoId.value;
    try {
      const response = await axios.post(`/dashboard/api/videos/${videoId}/reschedule`);
      alert('Video rescheduled successfully! Status updated to Pending.');
      closeEditVideoModal();
      location.reload();
    } catch (error) {
      console.error('Error rescheduling video:', error);
      const errorMsg = error.response?.data?.detail || 'Failed to reschedule video';
      alert(`Error: ${errorMsg}`);
    }
  }

  // Handle form submission
  editVideoForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const videoId = editVideoId.value;
    const title = editVideoTitle.value;
    const description = editVideoDescription.value;

    // Get selected platforms
    const platformCheckboxes = editPlatformsList.querySelectorAll('input[type="checkbox"]');
    const uploadDestinations = [];
    platformCheckboxes.forEach((checkbox) => {
      if (checkbox.checked) {
        uploadDestinations.push(checkbox.value);
      }
    });

    if (!title.trim()) {
      alert('Please enter a video title');
      return;
    }

    if (uploadDestinations.length === 0) {
      alert('Please select at least one platform');
      return;
    }

    editVideoSubmitBtn.disabled = true;
    editVideoSubmitBtn.textContent = 'Saving...';

    try {
      const response = await axios.put(`/dashboard/api/videos/${videoId}`, {
        title: title,
        captions: description,
        upload_destinations: uploadDestinations
      });

      if (response.status === 200) {
        alert('Video updated successfully!');
        closeEditVideoModal();
        // Reload the page to show updated data
        setTimeout(() => {
          location.reload();
        }, 500);
      }
    } catch (error) {
      console.error('Error updating video:', error);
      alert('Failed to update video. Please try again.');
    } finally {
      editVideoSubmitBtn.disabled = false;
      editVideoSubmitBtn.textContent = 'Save Changes';
    }
  });

  // Close modal when clicking outside
  editVideoModal.addEventListener('click', (e) => {
    if (e.target === editVideoModal) {
      closeEditVideoModal();
    }
  });
</script>
