<style>
        .navbar {
            background: rgba(5, 8, 22, 0.88);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(148, 163, 184, 0.12);
            padding: .75rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.22);
        }

        .navbar-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #f97316, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .navbar-brand:hover {
            transform: scale(1.05);
        }

        .navbar-nav {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 0.5rem;
        }

        .nav-item {
            position: relative;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            color: rgba(226, 232, 240, 0.82);
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(249, 115, 22, 0.12), transparent);
            transition: left 0.5s ease;
        }

        .nav-link:hover::before {
            left: 100%;
        }

        .nav-link:hover {
            color: white;
            background: rgba(249, 115, 22, 0.1);
            border: 1px solid rgba(249, 115, 22, 0.24);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(249, 115, 22, 0.18);
        }

        .nav-link.active {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.2), rgba(34, 211, 238, 0.18));
            color: white;
            border: 1px solid rgba(249, 115, 22, 0.3);
            box-shadow: 0 4px 20px rgba(249, 115, 22, 0.22);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            transition: all 0.3s ease;
        }

        .nav-link:hover .nav-icon {
            transform: scale(1.1);
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .mobile-menu-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        @media (max-width: 768px) {
            .navbar {
                padding: .3rem 1rem;
            }

            .mobile-menu-btn {
                display: block;
            }

            .navbar-nav {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: rgba(5, 8, 22, 0.98);
                backdrop-filter: blur(20px);
                flex-direction: column;
                padding: 1rem;
                border-top: 1px solid rgba(148, 163, 184, 0.12);
                transform: translateY(-100%);
                opacity: 0;
                visibility: hidden;
                transition: all 0.3s ease;
            }

            .navbar-nav.active {
                transform: translateY(0);
                opacity: 1;
                visibility: visible;
            }

            .nav-link {
                justify-content: flex-start;
                padding: 1rem;
                margin: 0.25rem 0;
            }
        }

        /* Floating animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .navbar-brand {
            animation: float 3s ease-in-out infinite;
        }
    </style>  
    <nav class="navbar">
         <!-- Navigation -->
        <div
            class="flex items-center justify-between px-6 py-4 max-w-7xl mx-auto"
        >
        <a href="/" class="flex items-center space-x-2">
            <img src="/static/icon.png" class="w-9 select-none" />
            <h3 class="text-xl font-semibold mt-1 text-white">Social Bot</h3>
        </a>
        <div class="flex items-center space-x-4">
            <span class="text-gray-400 md:flex hidden">Welcome back!</span>
            <div
            class="w-8 h-8 bg-gradient-to-r from-brand-orange to-brand-cyan rounded-full flex items-center justify-center"
            >
            <span class="text-white font-bold text-sm">U</span>
            </div>
        </div>
        </div>
        <div class="navbar-container">
            
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
                ☰
            </button>
            
            <ul class="navbar-nav" id="navbarNav">
                <li class="nav-item">
                    <a href="/dashboard" class="nav-link" data-page="dashboard">
                        <svg class="nav-icon" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
                        </svg>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/dashboard/videos/" class="nav-link" data-page="videos">
                        <svg class="nav-icon" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zM14.553 7.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z"/>
                        </svg>
                        Videos
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/dashboard/settings/" class="nav-link" data-page="settings">
                        <svg class="nav-icon" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
                        </svg>
                        Settings
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/dashboard/plan/" class="nav-link" data-page="plan">
                        <svg class="nav-icon" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4zM18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z"/>
                        </svg>
                        Plan
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <script>
        function toggleMobileMenu() {
            const navbarNav = document.getElementById('navbarNav');
            navbarNav.classList.toggle('active');
        }

        function setActiveLink() {
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-link');
            
            navLinks.forEach(link => {
                link.classList.remove('active');
                const linkPath = link.getAttribute('href');
                
                // Exact match or if current path starts with link path (for nested routes)
                if (currentPath === linkPath || 
                    (linkPath !== '/dashboard' && currentPath.startsWith(linkPath))) {
                    link.classList.add('active');
                }
                // Special case for dashboard root
                else if (linkPath === '/dashboard' && currentPath === '/dashboard') {
                    link.classList.add('active');
                }
            });
        }

        // Call on page load
        document.addEventListener('DOMContentLoaded', setActiveLink);
        document.addEventListener('visibilitychange', setActiveLink);
        window.addEventListener('popstate', setActiveLink);
    </script>
