<!-- Anti-Copyright Editor Modal -->
<div id="antiCopyrightModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="glass rounded-2xl p-8 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between mb-6">
      <h3 class="text-2xl font-bold text-white">Anti-Copyright Video Editor</h3>
      <button type="button" id="closeAntiCopyrightBtn" class="text-slate-400 hover:text-white transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <form id="antiCopyrightForm" class="space-y-8">
      <!-- Audio Controls -->
      <div class="space-y-4">
        <h4 class="text-lg font-semibold text-white flex items-center space-x-2">
          <svg class="w-5 h-5 text-brand-orange" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
          </svg>
          <span>Audio Controls</span>
        </h4>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Audio Speed: <span id="audioSpeedValue" class="text-brand-orange">103</span>%</label>
          <input type="range" id="audioSpeed" min="100" max="105" value="103" class="w-full h-2 bg-white/10 rounded-lg appearance-none cursor-pointer accent-brand-orange">
          <p class="text-xs text-slate-400 mt-1">Speed up audio by 3-5% to avoid detection</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Audio Frequency</label>
          <select id="audioFrequency" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-white focus:border-brand-orange/50 focus:outline-none transition-colors">
            <option value="44100">44100 Hz (CD Quality)</option>
            <option value="32000">32000 Hz (High)</option>
            <option value="22050" selected>22050 Hz (Standard)</option>
          </select>
          <p class="text-xs text-slate-400 mt-1">Lower frequencies reduce copyright bot detection</p>
        </div>
        <label class="flex items-center space-x-3 p-3 rounded-lg border border-white/10 hover:border-brand-orange/30 transition-colors cursor-pointer">
          <input type="checkbox" id="muteAudio" class="w-4 h-4 rounded">
          <span class="text-sm text-slate-300">Mute audio entirely</span>
        </label>
      </div>

      <!-- Text Overlay Controls -->
      <div class="space-y-4">
        <h4 class="text-lg font-semibold text-white flex items-center space-x-2">
          <svg class="w-5 h-5 text-brand-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span>Text Overlay</span>
        </h4>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Text Content</label>
          <input type="text" id="textContent" placeholder="@yourhandle" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-white placeholder-slate-500 focus:border-brand-orange/50 focus:outline-none transition-colors">
          <p class="text-xs text-slate-400 mt-1">Add your watermark or handle</p>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Text Color</label>
            <div class="flex items-center space-x-2">
              <input type="color" id="textColor" value="#FFFFFF" class="w-12 h-10 rounded-lg cursor-pointer">
              <span id="textColorValue" class="text-sm text-slate-300">white</span>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Text Opacity: <span id="textOpacityValue" class="text-brand-orange">60</span>%</label>
            <input type="range" id="textOpacity" min="10" max="100" value="60" step="5" class="w-full h-2 bg-white/10 rounded-lg appearance-none cursor-pointer accent-brand-orange">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Position</label>
            <select id="textGravity" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-white focus:border-brand-orange/50 focus:outline-none transition-colors">
              <option value="north">Top Center</option>
              <option value="south" selected>Bottom Center</option>
              <option value="north_east">Top Right</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Distance from Edge: <span id="textYGapValue" class="text-brand-orange">120</span>px</label>
            <input type="range" id="textYGap" min="50" max="200" value="120" step="5" class="w-full h-2 bg-white/10 rounded-lg appearance-none cursor-pointer accent-brand-orange">
          </div>
        </div>
      </div>

      <!-- Pixel Distortion Controls -->
      <div class="space-y-4">
        <h4 class="text-lg font-semibold text-white flex items-center space-x-2">
          <svg class="w-5 h-5 text-brand-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          <span>Pixel Distortion</span>
        </h4>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Vignette Strength: <span id="vignetteValue" class="text-brand-orange">10</span></label>
          <input type="range" id="vignetteStrength" min="0" max="30" value="10" step="1" class="w-full h-2 bg-white/10 rounded-lg appearance-none cursor-pointer accent-brand-orange">
          <p class="text-xs text-slate-400 mt-1">Dark edge effect (0 = disabled)</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Noise Strength: <span id="noiseValue" class="text-brand-orange">3</span></label>
          <input type="range" id="noiseStrength" min="0" max="10" value="3" step="1" class="w-full h-2 bg-white/10 rounded-lg appearance-none cursor-pointer accent-brand-orange">
          <p class="text-xs text-slate-400 mt-1">Grain effect (0 = disabled)</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-3 pt-6 border-t border-white/10">
        <button type="submit" id="saveAntiCopyrightBtn" class="btn-gradient px-6 py-2 rounded-lg text-white font-medium text-sm flex-1">Save Settings</button>
        <button type="button" id="resetAntiCopyrightBtn" class="px-6 py-2 rounded-lg border border-white/20 text-white font-medium text-sm hover:bg-white/5 transition-colors">Reset to Default</button>
        <button type="button" id="closeModalBtn" class="px-6 py-2 rounded-lg border border-slate-500/30 text-slate-300 font-medium text-sm hover:text-white hover:border-slate-400/50 transition-colors">Close</button>
      </div>
    </form>
  </div>
</div>
